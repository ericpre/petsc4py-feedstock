context:
  name: petsc4py
  version: "3.26.1"
  build: 1
  version_xy: ${{ (version | split('.'))[:2] | join('.') }}
  python_min: ${{ python_min | default("3.11") }}
  abi3_tag: cp${{ python_min | split(".") | join("") }}
  build_abi3: ${{ is_abi3 and match(python, ">=" + python_min) }}

package:
  name: petsc4py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 66a5c31de33293faefa72d6edc5abad5586f438c28842804de0044d8763087a2

build:
  number: ${{ build }}
  skip: is_abi3 and not match(python, python_min + ".*")
  python:
    version_independent: ${{ build_abi3 }}
  script:
    content:
      - if: win
        then:
          - set "CL=/Zc:preprocessor %CL%"
          - set "LINK=impi.lib %LINK%"
      - '"${{ PYTHON }}" conf/cythonize.py'
      - '"${{ PYTHON }}" -m pip -v install --no-deps --no-build-isolation .'
    env:
      PETSC_DIR: ${{ "%LIBRARY_PREFIX%" if win else "$PREFIX" }}
      PETSC4PY_BUILD_PYSABI: ${{ abi3_tag }}

requirements:
  build:
    - if: not win
      then: ${{ compiler('fortran') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cython
        - cross-python_${{ target_platform }}
        - numpy
        - if: mpi == 'openmpi'
          then:
            - ${{ mpi }}
  host:
    - python
    - if: build_abi3
      then: python-abi3
    - cython
    - pip
    - setuptools
    - numpy
    - ${{ mpi | replace('impi', 'impi-devel') }}
    - if: device == 'host'
      then:
        - petsc ${{ version_xy }}.* ${{ scalar }}_*
      else:
        - petsc ${{ version_xy }}.* ${{ device }}_${{ scalar }}_*
  run:
    - python
  run_constraints:
    - mpi4py >=3.0.1

tests:
  - if: device == 'host'
    then:
      - if: build_abi3
        then:
          - python:
              imports:
                - petsc4py
                - petsc4py.PETSc
              pip_check: true
              python_version:
                - ${{ python_min }}.*
                - "*"

          - script:
              - if: win
                then: abi3audit "%SP_DIR%/petsc4py/lib/PETSc.pyd" -s -v --assume-minimum-abi3 ${{ python_min }}
                else: abi3audit $SP_DIR/petsc4py/lib/*.so -s -v --assume-minimum-abi3 ${{ python_min }}
            requirements:
              run:
                - abi3audit
                - python 3.*

          - script:
              file: run_test
            files:
              source:
                - test/test_mat_schur.py
            requirements:
              run:
                - python ${{ python_min }}.*

          - script:
              file: run_test
            files:
              source:
                - test/test_mat_schur.py
            requirements:
              run:
                - python 3.*
        else:
          - python:
              imports:
                - petsc4py
                - petsc4py.PETSc
              pip_check: true

          - script:
              file: run_test
            files:
              source:
                - test/test_mat_schur.py
    else:
      # cuda builds are ~untestable
      # because petsc links libnvidia-ml, a driver library
      - python:
          pip_check: true


about:
  summary: Python bindings for PETSc
  license: BSD-2-Clause
  license_file: LICENSE.rst
  homepage: https://petsc.org/release/petsc4py/

extra:
  recipe-maintainers:
    - dalcinl
    - minrk
    - davidbrochart
    - SylvainCorlay
    - stefanozampini
